<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מבצע הנינטנדו של עומר ואליה 🎮</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070914;
      --card: #11162a;
      --blue: #00d9ff;
      --purple: #9b5cff;
      --green: #28ff8a;
      --yellow: #ffe94d;
      --orange: #ff9f1c;
      --text: #ffffff;
      --muted: #aab3d6;
      --danger: #ff4d6d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 80px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(0,217,255,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 10% 90%, rgba(155,92,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(40,255,138,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .pixel-deco {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
      animation: floatPx 8s ease-in-out infinite;
    }
    .pixel-deco:nth-child(1) { top: 8%;  left: 4%;  font-size: 2rem;   animation-delay: 0s; }
    .pixel-deco:nth-child(2) { top: 28%; right: 3%; font-size: 1.5rem; animation-delay: 2s; }
    .pixel-deco:nth-child(3) { bottom: 22%; left: 7%; font-size: 1.8rem; animation-delay: 4s; }
    .pixel-deco:nth-child(4) { bottom: 38%; right: 5%; font-size: 2.2rem; animation-delay: 1s; }
    .pixel-deco:nth-child(5) { top: 55%; left: 2%; font-size: 1.2rem; animation-delay: 3s; }

    @keyframes floatPx {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-20px) rotate(10deg); }
    }

    #confettiCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    #toastContainer {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      background: linear-gradient(135deg, rgba(17,22,42,0.98), rgba(23,29,54,0.98));
      border: 1px solid rgba(40,255,138,0.4);
      border-radius: 18px;
      padding: 13px 22px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--green);
      box-shadow: 0 4px 30px rgba(40,255,138,0.3);
      animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
      white-space: nowrap;
    }

    .toast.out { animation: toastOut 0.3s ease forwards; }

    @keyframes toastIn  { from { opacity:0; transform:translateY(20px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { to   { opacity:0; transform:translateY(-10px) scale(0.95); } }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 68px;
      background: rgba(10,14,28,0.97);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
      backdrop-filter: blur(16px);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 14px;
      transition: color 0.2s, background 0.2s;
      border: none;
      background: none;
    }

    .nav-btn span.icon { font-size: 1.4rem; }
    .nav-btn.active { color: var(--green); }
    .nav-btn.active .icon { filter: drop-shadow(0 0 6px rgba(40,255,138,0.6)); }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    .container {
      max-width: 1050px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 32px 24px 26px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(0,217,255,0.12), rgba(155,92,255,0.15), rgba(40,255,138,0.10));
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: 0 0 60px rgba(0,217,255,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(0,217,255,0.04) 60deg, transparent 120deg);
      animation: spin 20s linear infinite;
      pointer-events: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 7vw, 4.2rem);
      background: linear-gradient(135deg, var(--blue), var(--green), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      margin-top: 10px;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,159,28,0.15);
      border: 1px solid rgba(255,159,28,0.4);
      border-radius: 999px;
      padding: 5px 16px;
      margin-top: 12px;
      font-weight: 700;
      color: var(--orange);
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
    }

    section {
      background: rgba(17,22,42,0.9);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 26px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 30px rgba(155,92,255,0.08);
      backdrop-filter: blur(12px);
    }

    h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--blue);
      margin-bottom: 16px;
      text-shadow: 0 0 20px rgba(0,217,255,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-top {
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .ring-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      flex-shrink: 0;
    }

    .ring-wrap svg { transform: rotate(-90deg); }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ring-pct {
      font-family: 'Fredoka One', cursive;
      font-size: 1.9rem;
      color: var(--green);
      line-height: 1;
      text-shadow: 0 0 15px rgba(40,255,138,0.5);
    }

    .ring-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      flex: 1;
    }

    .stat {
      background: linear-gradient(145deg, #141929, #0d1022);
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.07);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .stat:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(40,255,138,0.15); }

    .stat::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--green), var(--blue));
      border-radius: 999px 999px 0 0;
    }

    .stat-label { color: var(--muted); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    .stat strong {
      display: block;
      font-family: 'Fredoka One', cursive;
      color: var(--green);
      font-size: 1.65rem;
      margin-top: 5px;
      text-shadow: 0 0 15px rgba(40,255,138,0.5);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .progress-wrap {
      background: #050711;
      border-radius: 999px;
      height: 36px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
      border-radius: 999px;
      transition: width 1s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 0 20px rgba(40,255,138,0.5), 0 0 40px rgba(0,217,255,0.3);
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 5px; bottom: 5px; left: 8px; right: 8px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      border-radius: 999px;
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer { 0% { transform:translateX(-100%); } 100% { transform:translateX(200%); } }

    .next-milestone-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .next-milestone-hint span { color: var(--yellow); }

    .input-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    input[type="number"], input[type="text"], input[type="password"] {
      flex: 1;
      min-width: 110px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.13);
      background: #090d1c;
      color: white;
      font-size: 1rem;
      font-family: 'Heebo', sans-serif;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 15px rgba(0,217,255,0.2);
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Heebo', sans-serif;
      font-size: 0.92rem;
      color: #06101a;
      background: linear-gradient(135deg, var(--green), var(--blue));
      box-shadow: 0 4px 18px rgba(0,217,255,0.3);
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 28px rgba(40,255,138,0.45); filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    button.danger {
      background: linear-gradient(135deg, var(--danger), #ff9f1c);
      color: white;
      box-shadow: 0 4px 18px rgba(255,77,109,0.3);
    }

    button.danger:hover { box-shadow: 0 6px 28px rgba(255,77,109,0.45); }

    button.secondary {
      background: linear-gradient(135deg, rgba(155,92,255,0.3), rgba(0,217,255,0.2));
      color: var(--text);
      border: 1px solid rgba(155,92,255,0.4);
      box-shadow: none;
    }

    button.secondary:hover { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #06101a; }

    .celebration {
      display: none;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--green);
      padding: 18px;
      border-radius: 18px;
      background: rgba(40,255,138,0.1);
      border: 1px solid rgba(40,255,138,0.4);
      margin-top: 14px;
      animation: celebPulse 1s ease-in-out infinite;
    }

    @keyframes celebPulse {
      0%,100% { box-shadow: 0 0 20px rgba(40,255,138,0.3); }
      50%      { box-shadow: 0 0 40px rgba(40,255,138,0.6); }
    }

    .milestones {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px,1fr));
      gap: 8px;
    }

    .milestone {
      background: #0f1423;
      color: #4a5168;
      padding: 11px 5px;
      border-radius: 13px;
      text-align: center;
      font-weight: 700;
      font-size: 0.78rem;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      line-height: 1.5;
    }

    .milestone.done {
      color: var(--green);
      border-color: rgba(40,255,138,0.4);
      background: rgba(40,255,138,0.07);
      box-shadow: 0 0 12px rgba(40,255,138,0.25);
      transform: scale(1.05);
    }

    .milestone.next {
      color: var(--yellow);
      border-color: rgba(255,233,77,0.5);
      background: rgba(255,233,77,0.08);
      box-shadow: 0 0 12px rgba(255,233,77,0.3);
      animation: next
